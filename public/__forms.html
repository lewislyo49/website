<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Netlify form detection</title></head>
  <body>
    <form name="project-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <select name="project-type"><option>Video Production</option></select>
      <input name="timeline" />
      <input name="budget" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
